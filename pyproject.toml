[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-scheduling-agent"
version = "0.1.0"
description = "Local agentic meeting scheduling system with OpenRouter and Google Calendar adapters"
requires-python = ">=3.10"
dependencies = [
  "dateparser>=1.2.0",
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "openai>=1.35.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
scheduler = "scheduler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
